name: Build and deploy website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Extract project files into repository
        run: |
          unzip -o bilingual-call-compass.zip -d .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract application source from project ZIP"
            git push
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Prepare Pages artifact
        run: |
          if [ -f .output/public/index.html ]; then
            cp -a .output/public ./pages-output
          elif [ -f dist/index.html ]; then
            cp -a dist ./pages-output
          else
            echo "Build succeeded but no static index.html was generated. This app needs a server-capable host, not GitHub Pages."
            find .output/public -maxdepth 2 -type f 2>/dev/null | head -50 || true
            exit 1
          fi
          touch pages-output/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
