name: Build and deploy website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract application source
        run: |
          mkdir -p app
          unzip -q bilingual-call-compass.zip -d app

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Build application
        working-directory: app
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          if [ -d app/.output/public ]; then
            cp -a app/.output/public ./pages-output
          elif [ -d app/dist ]; then
            cp -a app/dist ./pages-output
          else
            echo "No static output directory found. This app may require a server runtime rather than GitHub Pages."
            find app/.output -maxdepth 2 -type d 2>/dev/null || true
            exit 1
          fi
          touch pages-output/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
